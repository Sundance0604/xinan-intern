name: Python tests
on: [push, pull_request]
jobs:
  fifo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/bond_profit/requirements.txt
      - run: python -m unittest discover -s projects/bond_profit/tests -v
